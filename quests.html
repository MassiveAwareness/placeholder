<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Intel Quest Creator</title>
    <link rel="stylesheet" type="text/css" href="./layout.css" />

</head>

<body>
    <header>
        <h1>CivilWars Intel Quest Creator</h1>
    </header>

    <main>
        <section>
            <h2>Enter Details</h2>
            <form id="inputForm">
                <label for="level">Level:</label>
                <input type="number" id="level" name="level" required /><br />

                <label for="questType">Quest Type:</label>
                <select id="questType" name="questType" required>
                    <option value="0" selected disabled>Select quest type</option>
                    <option value="exploration">Exploration</option>
                    <option value="combat">Combat</option>
                    <option value="rescue">Rescue</option>
                </select><br />

                <label for="title">Title:</label>
                <input type="text" id="title" name="title" maxlength="24" required /><br />

                <label for="description">Description:</label>
                <input type="text" id="description" name="description" maxlength="128" required /><br />

                <label for="xCord">X Coordinate:</label>
                <input type="number" id="xCord" name="xCord" min="-100" max="100" step="0.1" required /><br />

                <label for="yCord">Y Coordinate:</label>
                <input type="number" id="yCord" name="yCord" min="-100" max="100" step="0.1" required /><br />

                <label for="food">Food Rewards:</label>
                <input type="number" id="food" name="food" required /><br />

                <label for="gold">Gold Rewards:</label>
                <input type="number" id="gold" name="gold" required /><br />

                <button type="submit">Save</button>
            </form>
        </section>
    </main>

    <script type="text/javascript" src="saveInput.js"></script>
</body>
</html>
